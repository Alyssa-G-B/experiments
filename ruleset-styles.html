<!DOCTYPE html>
<html>
    <head>
        <title>Ruleset styles</title>
        <style>
            #the-special{
                color:darkolivegreen !important;
            }
           h1,h2,h3,h4 {
               
               color:aquamarine;
               font-size: 30px;
               margin: 0;
            }
            .important{
                color:lightcoral;
                background-color: azure;
            }
            .uppercase{
                text-transform: uppercase;
            }
            #the-one{
                color:cadetblue;
            }
            h1{
                color:aliceblue;}
                /*This is a comment*/
            </style>
    </head>
    <body>
        <h1>
            Heading <span id="the-one">One</span>
        </h1>
        <h2 class="important uppercase">Heading 2</h2>
        <!--this is a comment-->
        <h3>Heading 3</h3>
        <h4 class="important">Heading 4</h4>
        <h1 class="uppercase">Heading 1</h1>
        <h2>Heading 2</h2>
        <h3 class="important uppercase" id="the-special">Heading 3</h3>
        <h4 class="uppercase">Heading 4</h4>
    </body>
</html>
